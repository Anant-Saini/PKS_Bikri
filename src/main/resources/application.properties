# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=bikri

# ===================================================================
# Database Connection Settings (PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ecom-solution
spring.datasource.username=anant-saini
spring.datasource.password=HarryPotter@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
# Determines schema generation behavior: 'validate' verifies schema against entities in production
spring.jpa.hibernate.ddl-auto=update

# Show formatted SQL queries in console for debugging (set to false in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Specify PostgreSQL dialect explicitly
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Open-In-View pattern (Disabled to prevent lazy loading connection leaks)
spring.jpa.open-in-view=false
