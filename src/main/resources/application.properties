# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=bikri

# ===================================================================
# Database Connection Settings (PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ecom-solution
spring.datasource.username=anant-saini
spring.datasource.password=HarryPotter@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
# Determines schema generation behavior: 'validate' verifies schema against entities in production
spring.jpa.hibernate.ddl-auto=update

# Show formatted SQL queries in console for debugging (set to false in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Specify PostgreSQL dialect explicitly
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Open-In-View pattern (Disabled to prevent lazy loading connection leaks)
spring.jpa.open-in-view=false

# ===================================================================
# JWT Configuration Properties
# ===================================================================
app.jwt.secret=9a2f8c4e7b1d3f5a6c8e0b2d4f6a8c0e2f4a6c8e0b2d4f6a8c0e2f4a6c8e0b2d
app.jwt.expiration-milliseconds=3600000  # 1 hour in milliseconds

# ===================================================================
# JWT Configuration Properties
# ===================================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.packages-to-scan=com.perfectkode.bikri
springdoc.paths-to-match=/api/**